<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Geist is the only family. Numerals are set in Geist with `tabular-nums`
      rather than in a second monospaced face, so there is one typeface to
      load and one to maintain.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f7" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0c" />
    <meta
      name="description"
      content="Dira is a transparent climate, conflict, and context situation room for IGAD."
    />
    <title>Dira — Causal Situation Room</title>
    <script>
      (() => {
        try {
          const stored = localStorage.getItem('dira-theme')
          const dark =
            stored === 'dark' ||
            (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch {
          // Storage and media queries can be unavailable in private contexts.
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
